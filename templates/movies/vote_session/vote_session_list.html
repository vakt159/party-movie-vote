{% extends "base.html" %}

{% block content %}
<div class="container mt-5">

    <div class="row mb-3">
        <div class="col">
            <h3>
                Search Events
                <span class="htmx-indicator text-muted fst-italic ms-2">
                    Searching...
                </span>
            </h3>
        </div>
    </div>

    <div class="row mb-4 g-2 align-items-center">
        <div class="col-md-9">
            <input class="form-control form-control-lg"
                   type="search"
                   name="search"
                   placeholder="Search..."
                   hx-get="{% url 'movies:vote-session-list-partial' %}"
                   hx-trigger="input changed delay:500ms"
                   hx-target="#search-results"
                   hx-indicator=".htmx-indicator">
        </div>

        <div class="col-md-3 text-md-end">
            <a href="{% url 'movies:vote-session-create' %}"
               class="btn btn-primary btn-lg w-100">
                + New
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="table-responsive shadow-sm rounded">
                <table class="table table-striped table-bordered text-center align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Event Date & Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="search-results">
                        {% include "movies/vote_session/partial/vote_session_partial.html" %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
{% endblock %}
