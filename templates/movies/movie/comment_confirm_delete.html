{% extends "base.html" %}

{% block content %}
<div class="container my-5">
  <div class="card shadow-sm border-danger">
    <div class="card-body text-center">
      <h3 class="card-title text-danger mb-3">⚠️ Confirm Deletion</h3>
      <p class="card-text mb-4">Are you sure you want to delete this comment?</p>
      <div class="d-flex justify-content-center gap-2">
        <form action="" method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
        </form>
        <a href="{% url 'movies:movie-detail' pk=object.movie.id %}" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
